name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Smoke-test the CLI end to end
        run: |
          python -m pdcluster.cli synth --out /tmp/ds --plates 8 --seed 3
          python -m pdcluster.cli train --dataset /tmp/ds --model /tmp/ranker.joblib
          python -m pdcluster.cli eval --dataset /tmp/ds --model /tmp/ranker.joblib --repeat
